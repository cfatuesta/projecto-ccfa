<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Latin Run Club</title>
    <script>
      // SPA fallback for GitHub Pages: rewrite the URL into a hash the
      // app reads on boot, then redirect to the app root.
      (function () {
        var repo = '/projecto-ccfa';
        var l = window.location;
        var path = l.pathname.slice(repo.length) || '/';
        var redirect = repo + '/?p=' + encodeURIComponent(path) + (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') + l.hash;
        l.replace(redirect);
      })();
    </script>
  </head>
  <body></body>
</html>
