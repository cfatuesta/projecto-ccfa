name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: AIzaSyDy9WWVY_9KDi_KsYtFTIxqRzUrD05o998
      VITE_FIREBASE_AUTH_DOMAIN: latinrunclub-f0001.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: latinrunclub-f0001
      VITE_FIREBASE_STORAGE_BUCKET: latinrunclub-f0001.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "69352689877"
      VITE_FIREBASE_APP_ID: "1:69352689877:web:a88ba98bd4c2cad7b6125c"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
